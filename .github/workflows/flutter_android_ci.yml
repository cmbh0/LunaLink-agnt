name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'APK build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Repair generated Flutter files only
        run: |
          flutter create --platforms=android --project-name lunalink_agnt --org com.lunalink --no-overwrite .
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          chmod +x android/gradlew || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Ensure CI debug keystore for release signing
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore android/app/debug.keystore \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        shell: bash
        run: |
          rm -f build/app/outputs/flutter-apk/*.apk
          flutter build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk
          if unzip -p build/app/outputs/flutter-apk/app-release.apk AndroidManifest.xml | strings | grep -q 'android:debuggable="true"'; then
            echo "Release APK is debuggable; refusing to upload."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LunaLink-agnt-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
